<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#87a96b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>HAYSTACK</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="css/style.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<div id="app">
  <canvas id="game-canvas"></canvas>

  <!-- HUD -->
  <div id="hud" class="pointer-none">
    <div class="hud-top-left">
      <div class="stat"><span class="ico">$</span><span id="hud-money">0</span></div>
      <div class="stat"><span class="ico">Lv</span><span id="hud-level">1</span></div>
      <div class="xp-bar"><div id="hud-xp-fill"></div></div>
      <div class="stat small">XP <span id="hud-xp">0/50</span></div>
    </div>
    <div class="hud-top-right">
      <button class="icon-btn" id="btn-missions" aria-label="Missions">📋</button>
      <button class="icon-btn" id="btn-inventory" aria-label="Inventory">🎒</button>
      <button class="icon-btn" id="btn-settings" aria-label="Settings">⚙️</button>
    </div>
    <div class="hud-tool">Tool: <span id="hud-tool-name">Hands</span></div>
    <div id="interact-prompt" class="hidden">Remove Hay</div>
    <div id="toast-area"></div>
  </div>

  <!-- Touch Controls -->
  <div id="controls" class="pointer-none">
    <div id="camera-area"></div>
    <div id="joystick-area">
      <div id="joystick-base"><div id="joystick-knob"></div></div>
    </div>
    <div id="action-buttons">
      <button class="action-btn" id="btn-sprint" aria-label="Sprint">⚡</button>
      <button class="action-btn" id="btn-crouch" aria-label="Crouch">⬇</button>
      <button class="action-btn" id="btn-jump" aria-label="Jump">⬆</button>
      <button class="action-btn primary" id="btn-interact" aria-label="Use">USE</button>
    </div>
  </div>

  <!-- MODAL: Generic panel -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-panel">
      <div class="modal-header">
        <h2 id="modal-title">Panel</h2>
        <button class="close-btn" id="modal-close">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Tutorial hint -->
  <div id="tutorial" class="hidden"></div>

  <!-- Start overlay -->
  <div id="start-overlay">
    <div class="start-card">
      <h1>HAYSTACK</h1>
      <p class="tagline">Find the needle. Build an empire.</p>
      <p class="hint">Use the joystick to move. Drag on the right side to look. Tap <b>USE</b> to remove hay.</p>
      <button id="start-btn">TAP TO START</button>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
